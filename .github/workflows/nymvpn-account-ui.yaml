name: NymVPN account layout
on:
  workflow_dispatch:
  push:
    branches: [codex/nymvpn-app-refresh]
    paths:
      - .github/workflows/nymvpn-account-ui.yaml
      - test/widgets/nymvpn_account_layout_test.dart
      - test/widgets/nymvpn_account_card_test.dart
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - name: Check compact layout and enlarged text
        env:
          NYMVPN_UI_CAPTURE: '1'
        run: |
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build --delete-conflicting-outputs
          dart format test/widgets/nymvpn_customization_layout_test.dart test/widgets/nymvpn_customization_test.dart test/widgets/nymvpn_account_layout_test.dart test/widgets/nymvpn_account_card_test.dart
          flutter test test/widgets/nymvpn_customization_layout_test.dart test/widgets/nymvpn_customization_test.dart test/widgets/nymvpn_account_layout_test.dart test/widgets/nymvpn_account_card_test.dart
          flutter analyze test/widgets/nymvpn_customization_layout_test.dart test/widgets/nymvpn_customization_test.dart test/widgets/nymvpn_account_layout_test.dart test/widgets/nymvpn_account_card_test.dart
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: NymVPN-account-layout
          path: |
            build/profile-preview/
            test/widgets/nymvpn_customization_layout_test.dart
            test/widgets/nymvpn_customization_test.dart
            test/widgets/nymvpn_account_layout_test.dart
            test/widgets/nymvpn_account_card_test.dart
