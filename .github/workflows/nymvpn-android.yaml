name: NymVPN Android canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Test core and port candidates
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          go test -count=1 . ./portprofile
          go vet . ./portprofile
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Install bindgen host library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libclang-18-dev
          echo 'LIBCLANG_PATH=/usr/lib/llvm-18/lib' >> "$GITHUB_ENV"
      - name: Build ARM64 canary
        run: flutter build apk --release --target-platform android-arm64
      - name: Record APK checksum
        run: sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NymVPN-FlClash-android-arm64-canary
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
