name: NymVPN Android canary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.4'
          cache-dependency-path: core/go.sum
      - name: Test core, transports, and port candidates
        working-directory: core
        env:
          CGO_ENABLED: '0'
        run: |
          go test -count=1 . ./telemost ./portprofile ./pathselect
          go vet . ./telemost ./portprofile ./pathselect
      - name: Test transport concurrency
        working-directory: core
        run: go test -race -count=1 ./telemost ./pathselect
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.1'
          cache: true
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
          add-to-path: true
          link-to-sdk: true
      - name: Verify Android native core linking
        working-directory: core
        env:
          GOOS: android
          GOARCH: arm64
          CGO_ENABLED: '1'
          CC: ${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang
        run: go build -tags=with_gvisor -buildmode=c-shared -o "$RUNNER_TEMP/libclash-android-check.so" .
      - name: Resolve Flutter dependencies
        run: |
          flutter pub get
          dart run intl_utils:generate
          dart run build_runner build --delete-conflicting-outputs
      - name: Verify app import and subscription refresh
        run: |
          dart format lib/views/nymvpn_customization.dart lib/enum/enum.dart lib/models/config.dart lib/views/dashboard/widget_registry.dart lib/views/dashboard/dashboard.dart lib/views/dashboard/widgets/nymvpn_account_card.dart lib/views/tools.dart lib/models/state.dart lib/providers/state/system.dart lib/plugins/service.dart lib/manager/android_manager.dart lib/manager/app_manager.dart lib/providers/actions/setup.dart test/models/nymvpn_customization_test.dart test/widgets/nymvpn_customization_test.dart
          dart format lib/common/nymvpn_account.dart lib/views/dashboard/widgets/nymvpn_account_card.dart lib/views/dashboard/dashboard.dart lib/manager/app_manager.dart test/common/nymvpn_account_test.dart test/widgets/nymvpn_account_card_test.dart lib/application.dart lib/common/nymvpn_profile.dart lib/common/profile_refresh.dart lib/common/request.dart lib/common/http.dart lib/common/link.dart lib/common/constant.dart lib/models/profile.dart lib/providers/action.dart lib/providers/actions/profiles.dart test/common/nymvpn_profile_test.dart test/common/request_test.dart test/models/profile_save_test.dart
          cp pubspec.yaml "$RUNNER_TEMP/pubspec-build.yaml"
          sed -i 's/build_assets: true/build_assets: false/g' pubspec.yaml
          flutter test test/models/config_test.dart test/providers/config_test.dart test/widgets/super_grid_test.dart test/models/nymvpn_customization_test.dart test/widgets/nymvpn_customization_test.dart test/providers/setup_action_test.dart test/widgets/dashboard_layout_test.dart test/common/nymvpn_account_test.dart test/widgets/nymvpn_account_card_test.dart test/common/nymvpn_profile_test.dart test/common/request_test.dart test/common/link_test.dart test/models/profile_save_test.dart test/models/profile_test.dart test/providers/action_test.dart test/application_test.dart
          flutter analyze lib/views/nymvpn_customization.dart lib/enum/enum.dart lib/models/config.dart lib/views/dashboard/widget_registry.dart lib/views/dashboard/dashboard.dart lib/views/dashboard/widgets/nymvpn_account_card.dart lib/views/tools.dart lib/models/state.dart lib/providers/state/system.dart lib/plugins/service.dart lib/manager/android_manager.dart lib/manager/app_manager.dart test/models/nymvpn_customization_test.dart test/widgets/nymvpn_customization_test.dart
          flutter analyze lib/common/nymvpn_account.dart lib/views/dashboard/widgets/nymvpn_account_card.dart lib/views/dashboard/dashboard.dart lib/manager/app_manager.dart test/common/nymvpn_account_test.dart test/widgets/nymvpn_account_card_test.dart lib/application.dart lib/common/nymvpn_profile.dart lib/common/profile_refresh.dart lib/common/request.dart lib/models/profile.dart lib/providers/action.dart
          cp "$RUNNER_TEMP/pubspec-build.yaml" pubspec.yaml
      - name: Upload formatted app sources
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NymVPN-formatted-sources
          path: |
            lib/application.dart
            lib/common/nymvpn_profile.dart
            lib/common/profile_refresh.dart
            lib/common/request.dart
            lib/common/http.dart
            lib/common/link.dart
            lib/common/constant.dart
            lib/models/profile.dart
            lib/providers/action.dart
            lib/providers/actions/profiles.dart
            test/common/nymvpn_profile_test.dart
            test/common/request_test.dart
            test/models/profile_save_test.dart
            lib/common/nymvpn_account.dart
            lib/views/dashboard/widgets/nymvpn_account_card.dart
            lib/views/dashboard/dashboard.dart
            lib/manager/app_manager.dart
            test/common/nymvpn_account_test.dart
            test/widgets/nymvpn_account_card_test.dart
            lib/l10n/
            pubspec.lock
            lib/views/nymvpn_customization.dart
            lib/enum/enum.dart
            lib/models/config.dart
            lib/views/dashboard/widget_registry.dart
            lib/views/dashboard/dashboard.dart
            lib/views/dashboard/widgets/nymvpn_account_card.dart
            lib/views/tools.dart
            lib/models/state.dart
            lib/providers/state/system.dart
            lib/plugins/service.dart
            lib/manager/android_manager.dart
            lib/manager/app_manager.dart
            lib/providers/actions/setup.dart
            test/models/nymvpn_customization_test.dart
            test/widgets/nymvpn_customization_test.dart
            lib/database/generated/
            lib/models/generated/
            lib/providers/generated/
      - name: Verify Android service lifecycle and power policy
        working-directory: android
        run: |
          { echo "flutter.sdk=$FLUTTER_ROOT"; echo "sdk.dir=$ANDROID_HOME"; } > local.properties
          wrapper="$FLUTTER_ROOT/bin/cache/artifacts/gradle_wrapper"
          test -d "$wrapper" || flutter precache
          cp -R "$wrapper/." .
          chmod +x gradlew
          ./gradlew :common:testDebugUnitTest :service:testDebugUnitTest :app:testDebugUnitTest -x :app:compileFlutterBuildDebug -x :app:copyFlutterAssetsDebug
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NymVPN-native-tests
          path: build/**/test-results/
      - name: Install bindgen host library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libclang-18-dev
          echo 'LIBCLANG_PATH=/usr/lib/llvm-18/lib' >> "$GITHUB_ENV"
      - name: Restore private signing identity
        env:
          KEYSTORE: ${{ secrets.NYMVPN_ANDROID_KEYSTORE }}
          STORE_PASSWORD: ${{ secrets.NYMVPN_ANDROID_PASSWORD }}
        run: |
          test -n "$KEYSTORE"
          test -n "$STORE_PASSWORD"
          umask 077
          printf '%s' "$KEYSTORE" | base64 --decode > android/app/keystore.jks
          printf '\nstorePassword=%s\nkeyAlias=nymvpn\nkeyPassword=%s\n' "$STORE_PASSWORD" "$STORE_PASSWORD" >> android/local.properties
      - name: Build ARM64 canary
        run: flutter build apk --release --target-platform android-arm64 --build-number=2026093007 --build-name=0.8.98-nymvpn.7
      - name: Remove signing material
        if: always()
        run: rm -f android/app/keystore.jks android/local.properties
      - name: Record APK checksum
        run: |
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: NymVPN-FlClash-android-arm64-canary
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS
          if-no-files-found: error
          retention-days: 14
