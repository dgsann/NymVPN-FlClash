name: Publish verified NymVPN canary

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: Successful Android canary run ID
        required: true

permissions:
  actions: read
  contents: write

defaults:
  run:
    shell: bash

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_RUN: ${{ inputs.source_run }}
      SOURCE_SHA: a259a4f47d63fe910df65e34eebdebb9c71521ca
      EXPECTED_SIGNER: 3cd6e45336c130007d449327ee003275ae7e474ad23692cb41b22d54ce5a789b
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify source build and download artifact
        run: |
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]]
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > source-run.json
          jq -e --arg sha "$SOURCE_SHA" '.head_sha == $sha and .conclusion == "success" and .path == ".github/workflows/nymvpn-android.yaml" and .event == "workflow_dispatch"' source-run.json
          gh run download "$SOURCE_RUN" --repo "$GITHUB_REPOSITORY" --name NymVPN-FlClash-android-arm64-canary --dir artifact
      - name: Verify checksum, signature, and Android package
        run: |
          expected=$(awk '{print $1}' artifact/SHA256SUMS)
          echo "$expected  artifact/app-release.apk" | sha256sum --check
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)
          "$signer" verify --verbose --print-certs artifact/app-release.apk | tee apk-signature.txt
          grep -Fx 'Number of signers: 1' apk-signature.txt
          grep -F "certificate SHA-256 digest: $EXPECTED_SIGNER" apk-signature.txt
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -n 1)
          "$aapt" dump badging artifact/app-release.apk > apk-package.txt
          grep -F "package: name='com.follow.clash.nymvpn' versionCode='2026093007' versionName='0.8.98-nymvpn.7'" apk-package.txt
          grep -F "application-label:'NymVPN'" apk-package.txt
          unzip -p artifact/app-release.apk lib/arm64-v8a/libclash.so > "$RUNNER_TEMP/libclash.so"
          grep -aFq 'x-nymvpn-telemost' "$RUNNER_TEMP/libclash.so"
          grep -aFq 'Telemost transport is stopped' "$RUNNER_TEMP/libclash.so"
          grep -aFq 'x-nymvpn-auto' "$RUNNER_TEMP/libclash.so"
          grep -aFq 'AutoTCP probe payload incomplete or invalid' "$RUNNER_TEMP/libclash.so"
      - name: Publish prerelease
        run: |
          mv artifact/app-release.apk artifact/NymVPN-FlClash-0.8.98-nymvpn.7-arm64.apk
          (cd artifact && sha256sum NymVPN-FlClash-0.8.98-nymvpn.7-arm64.apk > SHA256SUMS)
          tag_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v0.8.98-nymvpn.7" --jq '.object.sha')
          test "$tag_sha" = "$SOURCE_SHA"
          gh release create v0.8.98-nymvpn.7 \
            --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease \
            --title 'NymVPN :3 — настройка под себя' \
            --notes-file release-notes/nymvpn-7.md \
            artifact/NymVPN-FlClash-0.8.98-nymvpn.7-arm64.apk artifact/SHA256SUMS
